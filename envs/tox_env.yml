name: tox_env
channels:
  # conda-forge before bioconda, and nodefaults, for the same reason as
  # macrel_env.yml — see the comment there.
  - conda-forge
  - nodefaults

# ToxinPred3 (toxicity) and AlgPred 2.0 (allergenicity).
#
# Both are Raghava-group packages with the same pickle pins, so they
# share one environment; verified that installing both leaves
# ToxinPred3's scores unchanged.
#
# This needs an environment of its own — it can share neither pega_env
# nor hemo_env. ToxinPred3's ExtraTrees models are pickles fitted under
# scikit-learn 1.0.2, and the tree node struct gained a field in 1.3, so
# loading them under anything >= 1.3 fails outright:
#
#   ValueError: node array from the pickle has an incompatible dtype
#
# pega_env pins scikit-learn >= 1.3 and hemo_env pins exactly 1.3.1, so
# both are ruled out. Verified: the pins below load the models and give
# scores identical to scikit-learn 1.2.2.

dependencies:
  # scikit-learn 1.0.2 ships no wheels past Python 3.10.
  - python=3.10
  - pip
  - pip:
      - toxinpred3==1.4
      - algpred2==1.4
      # Not a precaution — this pin is what makes the package work.
      - scikit-learn==1.0.2
      # scikit-learn 1.0.2's compiled extensions break against newer
      # numpy: "numpy.dtype size changed, may indicate binary
      # incompatibility".
      - numpy==1.22.4
