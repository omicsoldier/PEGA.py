name: macrel_env
channels:
  # conda-forge MUST come before bioconda: bioconda still ships a 2017-era
  # urllib3 1.12 (py27-py36 only), and under strict channel priority that
  # shadows conda-forge's, making requests/pooch/scipy unsolvable.
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - python=3.10
  - macrel=1.6.0
  - numpy=1.24
  - scikit-learn=1.3
  - scipy=1.10
  - pandas=2.0
  - onnxruntime=1.18
