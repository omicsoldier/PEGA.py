name: ampactipred_env
channels:
  # conda-forge before bioconda, and nodefaults, for the same reason as
  # macrel_env.yml — see the comment there.
  - conda-forge
  - nodefaults

# AMPActiPred (antibacterial activity, deep forest).
#
# This needs an environment of its own and can share none of the others.
# Two independent constraints pin it:
#
#   * deep-forest publishes no wheel past CPython 3.9 — not for 0.1.5,
#     not for 0.1.7, not for any version — and it is a compiled package,
#     so there is nothing to build from on 3.10+.
#
#   * deep-forest 0.1.5, the version the authors trained with, imports
#     sklearn.utils.fixes._joblib_parallel_args, which scikit-learn
#     removed in 1.1:
#
#       ImportError: cannot import name '_joblib_parallel_args'
#
#     so scikit-learn must stay at 1.0.x.
#
# pega_env and tox_env are both Python 3.10, and hemo_env pins
# scikit-learn 1.3.1, so none of them can host this.

dependencies:
  # The newest Python deep-forest has wheels for.
  - python=3.9
  - pip
  - pip:
      # The version the models were trained and saved with. deep-forest's
      # save format is joblib dumps of its own estimator classes, so the
      # version that wrote them is the one that reads them back.
      - deep-forest==0.1.5
      # Not a precaution — see the ImportError above.
      - scikit-learn==1.0.2
      # The authors pin 1.18.5, which has no CPython 3.9 wheel (numpy
      # added 3.9 support in 1.19.3). 1.19.5 is the nearest that does.
      - numpy==1.19.5
      # The authors pin modlamp 4.3.0, which cannot install: it requires
      # mysql-connector-python==8.0.17, a version with no wheel for any
      # Python this environment can run. 4.3.2 is the same descriptor
      # code with a looser pin, and is what pega_env uses as well.
      - modlamp>=4.3.2
      - pandas
      - biopython
      - joblib
