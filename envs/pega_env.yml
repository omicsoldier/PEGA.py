name: pega_env
channels:
  - conda-forge
  - bioconda
  - defaults

# Main PEGA environment.
# Versions below are pinned to a combination verified end-to-end
# (all 10 predictors scoring successfully, PEGA v0.1.0).
#
# After creating the environment:
#   conda activate pega_env
#   pip install -e /path/to/PEGA
#
# Then run the post-install steps in the README (ampir, amPEPpy).

dependencies:
  - python=3.10          # pin to 3.10 — required for TensorFlow + modlAMP compatibility
  - numpy=2.2
  - joblib>=1.3
  - tqdm
  - requests
  - rich>=13.0
  # R for ampir predictors
  - r-base=4.5
  - r-rlang>=1.1.7       # ampir requires >=1.1.7; pin here avoids post-install conflict
  # Deep learning stack — CPU-only nodes run these fine; conda-forge's
  # builds fall back to CPU automatically when no GPU/CUDA driver is present.
  - tensorflow=2.19
  - keras=3.12
  - pytorch=2.10
  - transformers>=4.35
  - pip
  - pip:
      - biopython>=1.81
      - pandas>=2.0
      - scikit-learn>=1.3
      - modlamp>=4.3.2
      # AlgPred3 (allergenicity). Pinned like the other Raghava-group
      # packages: the CLI is a thin wrapper whose flags have changed
      # between releases. Its own requirements list only pandas and
      # joblib, but unpickling the model needs scikit-learn (above) —
      # the model was fitted under 1.4.2 and loads on >= 1.3.
      #
      # The 6 kB wheel downloads ~210 MB of model and feature binary on
      # first use; setup_environments.sh warms that up.
      - algpred3==1.3
      # amPEPpy is not published on PyPI — must be installed from git (see README)
